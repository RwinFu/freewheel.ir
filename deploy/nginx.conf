# تنظیمات Nginx برای freewheel.ir — پروکسی معکوس به سرور Next.js
# مسیر پیشنهادی: /etc/nginx/sites-available/freewheel.ir  سپس:
#   sudo ln -s /etc/nginx/sites-available/freewheel.ir /etc/nginx/sites-enabled/
# گام اول فقط بلوک HTTP را فعال کنید؛ بعد با certbot گواهی بگیرید تا
# بلوک HTTPS و ریدایرکت‌ها فعال شوند:
#   sudo certbot --nginx -d freewheel.ir -d www.freewheel.ir

# ریدایرکت www → نسخه‌ی اصلی (در هر دو پروتکل)
server {
    listen 80;
    listen [::]:80;
    server_name www.freewheel.ir;
    return 301 $scheme://freewheel.ir$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    # بعد از گرفتن SSL، این دو خط را به زیر اضافه کنید:
    # listen 443 ssl;
    # listen [::]:443 ssl;
    server_name freewheel.ir;

    # certbot خودش این خطوط را می‌سازد:
    # ssl_certificate     /etc/letsencrypt/live/freewheel.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/freewheel.ir/privkey.pem;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml font/woff2;
    gzip_vary on;

    # دارایی‌های هش‌دار Next — کش ابدی، امن است
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # مدیا، فونت و کات‌اوت‌ها — کش بلندمدت (یک‌روزه تا یک‌ماهه)
    location ~* ^/(media|fonts|cutouts)/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=604800";
    }

    # بقیه‌ی درخواست‌ها به اپ
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# بعد از فعال شدن SSL، بلوک HTTP بالا باید به HTTPS ریدایرکت کند:
#     location / { return 301 https://freewheel.ir$request_uri; }
